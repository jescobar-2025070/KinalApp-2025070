<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" href="/images/favicon.ico"/>
    <title>Detalle de Venta | KinalApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/kinalapp.css}"/>
</head><body>

    <header class="k-navbar">
        <button class="k-toggle-btn" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
        <a class="k-navbar-brand" th:href="@{/dashboard}" style="margin-left:8px;">
            <div class="k-logo-slot">
                <img th:src="@{/images/logoalt.png}" alt="Logo"/>
            </div>
            <span class="k-brand-name">KinalApp</span>
        </a>

        <div class="flex-1"></div>
        <div class="k-navbar-user">
            <i class="bi bi-person-circle" style="font-size:16px;color:var(--k-teal)"></i>
            <strong sec:authentication="name">Usuario</strong>
        </div>
    </header>
    <div id="wrapper" style="display:flex;">
    <nav id="kSidebar" class="k-sidebar">
        <div class="k-sidebar-header">
            <a class="k-navbar-brand" th:href="@{/dashboard}">
                <div class="k-logo-slot">
                    <img th:src="@{/images/logo.png}" alt="Logo"/>
                    <span class="k-logo-fallback">K</span>
                </div>
                <span class="k-brand-name">KinalApp</span>
            </a>
        </div>
        <div class="k-sidebar-body">
            <div class="k-nav-section">
                <span class="k-nav-label">Principal</span>
                <ul class="list-unstyled mb-0">
                <li><a class="k-nav-link" th:href="@{/dashboard}"><span class="k-nav-icon"><i class="bi bi-speedometer2"></i></span>Dashboard</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/clientes}"><span class="k-nav-icon"><i class="bi bi-people"></i></span>Clientes</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/productos}"><span class="k-nav-icon"><i class="bi bi-box-seam"></i></span>Productos</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/ventas}"><span class="k-nav-icon"><i class="bi bi-receipt"></i></span>Ventas</a></li>
                <li><a class="k-nav-link active" th:href="@{/vista/detalles}"><span class="k-nav-icon"><i class="bi bi-list-check"></i></span>Detalle de Ventas</a></li>
                </ul>
            </div>
            <div class="k-nav-section" sec:authorize="hasRole('ADMIN')">
                <span class="k-nav-label">Administración</span>
                <ul class="list-unstyled mb-0">
                    <li><a class="k-nav-link" th:href="@{/vista/usuarios}"><span class="k-nav-icon"><i class="bi bi-building-lock"></i></span>Usuarios</a></li>
                </ul>
            </div>
        </div>
        <div class="k-sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="k-logout-btn">
                    <span class="k-nav-icon"><i class="bi bi-box-arrow-right"></i></span>Cerrar sesión
                </button>
            </form>
        </div>
    </nav>
        <div id="page-content">
            <div style="padding:28px 28px 40px;"><nav class="k-breadcrumb"><a href="/dashboard" th:href="@{/dashboard}">Dashboard</a><span class="sep">/</span><a href="/vista/detalles" th:href="@{/vista/detalles}">Detalle de Ventas</a><span class="sep">/</span><span class="current">Formulario</span></nav>
                <div style="max-width:700px;margin:0 auto;"><div class="k-card">
                    <div class="k-card-header"><h2 class="k-card-title"><i class="bi bi-list-check" style="color:var(--k-ocean)"></i><span th:text="${detalle.codigoDetalleVenta != null ? 'Editar Detalle' : 'Nuevo Detalle de Venta'}">Detalle</span></h2></div>
                    <div class="k-card-body">
                        <form th:action="@{/vista/detalles/guardar}" method="post" class="k-needs-validation" novalidate id="formDetalle">
                            <input type="hidden" name="codigoDetalleVenta" th:value="${detalle.codigoDetalleVenta}"/>
                            <div class="k-form-group"><label class="k-label">Venta <span class="req">*</span></label>
                                <select id="ventaId" name="ventaId" class="k-select" required>
                                    <option value="">-- Selecciona una venta --</option>
                                    <option th:each="v : ${ventas}" th:value="${v.codigoVenta}"
                                            th:text="${'Venta #' + v.codigoVenta + ' — ' + v.fechaVenta + ' — ' + (v.cliente != null ? v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente : 'Sin cliente')}"
                                            th:selected="${detalle.codigoVenta != null and detalle.codigoVenta.codigoVenta == v.codigoVenta}"></option>
                                </select>
                            </div>
                            <div class="k-form-group"><label class="k-label">Producto <span class="req">*</span></label>
                                <select id="productoId" name="productoId" class="k-select" required onchange="alCambiarProducto(this)">
                                    <option value="">-- Selecciona un producto --</option>
                                    <option th:each="p : ${productos}" th:value="${p.codigoProducto}"
                                            th:text="${p.nombreProducto + ' — Stock: ' + p.stock + ' — Q ' + p.precio}"
                                            th:attr="data-precio=${p.precio}"
                                            th:selected="${detalle.codigoProducto != null and detalle.codigoProducto.codigoProducto == p.codigoProducto}"></option>
                                </select>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 2fr 2fr;gap:16px;">
                                <div class="k-form-group"><label class="k-label">Cantidad <span class="req">*</span></label>
                                    <input type="number" id="cantidad" name="cantidad" class="k-input"
                                           th:value="${detalle.cantidad > 0 ? detalle.cantidad : ''}"
                                           placeholder="0" min="1" required oninput="calcularSubtotal()"/>
                                </div>
                                <div class="k-form-group"><label class="k-label">Precio Unit. (Q)</label>
                                    <div class="k-input-group"><span class="k-input-prefix">Q</span>
                                    <input type="number" id="precioUnitario" name="precioUnitario" class="k-input" th:value="${detalle.precioUnitario}" placeholder="0.00" step="0.01" readonly/></div>
                                    <span class="k-hint">Auto al elegir producto</span>
                                </div>
                                <div class="k-form-group"><label class="k-label">Subtotal (Q)</label>
                                    <div class="k-input-group"><span class="k-input-prefix">Q</span>
                                    <input type="number" id="subTotal" name="subTotal" class="k-input" th:value="${detalle.subTotal}" placeholder="0.00" step="0.01" readonly style="color:var(--k-teal);font-weight:600;"/></div>
                                    <span class="k-hint">Cantidad x Precio</span>
                                </div>
                            </div>
                            <div id="resumenCalculo" class="k-calc-box" style="display:none;">
                                <i class="bi bi-calculator"></i><span id="textoResumen"></span>
                            </div>
                            <div class="d-flex gap-2 justify-end" style="margin-top:8px;">
                                <a th:href="@{/vista/detalles}" class="k-btn k-btn-ghost">Cancelar</a>
                                <button type="submit" class="k-btn k-btn-primary" id="btnGuardar" disabled>
                                    <i class="bi bi-floppy"></i><span th:text="${detalle.codigoDetalleVenta != null ? 'Guardar cambios' : 'Registrar detalle'}">Guardar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/kinalapp.js}"></script>
<script th:inline="javascript">
const _precio   = /*[[${detalle.precioUnitario}]]*/ null;
const _cantidad = /*[[${detalle.cantidad}]]*/ 0;
window.addEventListener('DOMContentLoaded',function(){
    var sel=document.getElementById('productoId');
    if(sel && sel.value){var opt=sel.options[sel.selectedIndex];var p=opt.getAttribute('data-precio');if(p){document.getElementById('precioUnitario').value=parseFloat(p).toFixed(2);}}
    if(_precio && _cantidad>0){calcularSubtotal();}
});
function alCambiarProducto(sel){
    var opt=sel.options[sel.selectedIndex];var precio=opt?opt.getAttribute('data-precio'):null;
    document.getElementById('precioUnitario').value=precio?parseFloat(precio).toFixed(2):'';
    calcularSubtotal();
}
function calcularSubtotal(){
    var cant=parseInt(document.getElementById('cantidad').value)||0;
    var precio=parseFloat(document.getElementById('precioUnitario').value)||0;
    var sub=cant*precio;
    document.getElementById('subTotal').value=sub>0?sub.toFixed(2):'';
    var res=document.getElementById('resumenCalculo');
    var btn=document.getElementById('btnGuardar');
    if(cant>0&&precio>0){
        document.getElementById('textoResumen').textContent=cant+' und x Q'+precio.toFixed(2)+' = Q'+sub.toFixed(2);
        res.style.display='flex';btn.disabled=false;
    }else{res.style.display='none';btn.disabled=true;}
}
</script>
</body></html>
