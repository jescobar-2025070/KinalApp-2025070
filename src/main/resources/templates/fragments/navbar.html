<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
    FRAGMENTO: navbar
    Uso: <div th:replace="~{fragments/navbar :: navbar}"></div>
-->
<nav th:fragment="navbar" class="navbar navbar-dark bg-primary fixed-top shadow-sm">
    <div class="container-fluid">
        <button class="btn btn-outline-light me-2" id="sidebarToggle" type="button">
            <i class="bi bi-list fs-5"></i>
        </button>
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-shop me-2"></i>KinalApp
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white-50 small d-none d-md-inline">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name">Usuario</span>
            </span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
