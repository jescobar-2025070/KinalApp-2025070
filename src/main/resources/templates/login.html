<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" href="/images/favicon.ico"/>
    <title>Iniciar Sesión | KinalApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/kinalapp.css}"/>
</head>
<body class="k-auth-bg">
<div class="k-auth-card">
    <div class="k-auth-logo">
        <img th:src="@{/images/logo.png}" alt="Logo"/>
    </div>
    <h1 class="k-auth-title">KinalApp</h1>
    <p class="k-auth-sub">Sistema de Gestión de Ventas</p>
    <div th:if="${param.error}" class="k-alert k-alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i><span>Usuario o contraseña incorrectos.</span>
    </div>
    <div th:if="${param.logout}" class="k-alert k-alert-success">
        <i class="bi bi-check-circle-fill"></i><span>Sesión cerrada correctamente.</span>
    </div>
    <form th:action="@{/login}" method="post">
        <div class="k-form-group">
            <label for="username" class="k-label">Usuario</label>
            <input type="text" id="username" name="username" class="k-input" placeholder="Tu nombre de usuario" required autofocus/>
        </div>
        <div class="k-form-group" style="margin-bottom:24px;">
            <label for="password" class="k-label">Contraseña</label>
            <div style="position:relative;">
                <input type="password" id="password" name="password" class="k-input" placeholder="••••••••" required style="padding-right:42px;"/>
                <button type="button" id="togglePwd" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--k-muted);cursor:pointer;font-size:15px;">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="k-btn k-btn-primary" style="width:100%;justify-content:center;padding:11px;">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
    </form>
    <hr class="k-auth-divider"/>
    <p style="text-align:center;font-size:12.5px;color:var(--k-muted);margin:0;">
        ¿No tienes cuenta? <a th:href="@{/registro}" style="color:var(--k-teal);font-weight:600;text-decoration:none;">Regístrate aquí</a>
    </p>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/kinalapp.js}"></script>
<script>
document.getElementById('togglePwd').addEventListener('click',function(){
    const i=document.getElementById('password'),e=document.getElementById('eyeIcon');
    if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}
    else{i.type='password';e.className='bi bi-eye';}
});
</script>
</body></html>
