<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" href="/images/favicon.ico"/>
    <title>Crear Cuenta | KinalApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/kinalapp.css}"/>
</head>
<body class="k-auth-bg">
<div class="k-auth-card">
    <div class="k-auth-logo">
        <img th:src="@{/images/logo.png}" alt="Logo"/>
    </div>
    <h1 class="k-auth-title">Crear Cuenta</h1>
    <p class="k-auth-sub">Completa los datos para registrarte</p>
    <div th:if="${error}" class="k-alert k-alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
    </div>
    <form th:action="@{/registro}" th:object="${usuario}" method="post" class="k-needs-validation" novalidate>
        <div class="k-form-group">
            <label class="k-label">Nombre de Usuario <span class="req">*</span></label>
            <input type="text" th:field="*{userName}" class="k-input" placeholder="Ej: jperez" required minlength="3" maxlength="50"/>
        </div>
        <div class="k-form-group">
            <label class="k-label">Correo Electrónico</label>
            <input type="email" th:field="*{email}" class="k-input" placeholder="correo@ejemplo.com" maxlength="100"/>
        </div>
        <div class="k-form-group" style="margin-bottom:24px;">
            <label class="k-label">Contraseña <span class="req">*</span></label>
            <input type="password" th:field="*{password}" class="k-input" placeholder="Mínimo 6 caracteres" required minlength="6"/>
        </div>
        <button type="submit" class="k-btn k-btn-primary" style="width:100%;justify-content:center;padding:11px;">
            <i class="bi bi-person-plus"></i> Crear cuenta
        </button>
    </form>
    <hr class="k-auth-divider"/>
    <p style="text-align:center;font-size:12.5px;color:var(--k-muted);margin:0;">
        ¿Ya tienes cuenta? <a th:href="@{/login}" style="color:var(--k-teal);font-weight:600;text-decoration:none;">Inicia sesión</a>
    </p>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/kinalapp.js}"></script>
</body></html>
