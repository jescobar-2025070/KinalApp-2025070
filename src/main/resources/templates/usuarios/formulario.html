<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" href="/images/favicon.ico"/>
    <title>Usuario | KinalApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/kinalapp.css}"/>
</head><body>

    <header class="k-navbar">
        <button class="k-toggle-btn" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
        <a class="k-navbar-brand" th:href="@{/dashboard}" style="margin-left:8px;">
            <div class="k-logo-slot">
                <img th:src="@{/images/logoalt.png}" alt="Logo"/>
            </div>
            <span class="k-brand-name">KinalApp</span>
        </a>

        <div class="flex-1"></div>
        <div class="k-navbar-user">
            <i class="bi bi-person-circle" style="font-size:16px;color:var(--k-teal)"></i>
            <strong sec:authentication="name">Usuario</strong>
        </div>
    </header>
    <div id="wrapper" style="display:flex;">
    <nav id="kSidebar" class="k-sidebar">
        <div class="k-sidebar-header">
            <a class="k-navbar-brand" th:href="@{/dashboard}">
                <div class="k-logo-slot">
                    <img th:src="@{/images/logo.png}" alt="Logo"/>
                    <span class="k-logo-fallback">K</span>
                </div>
                <span class="k-brand-name">KinalApp</span>
            </a>
        </div>
        <div class="k-sidebar-body">
            <div class="k-nav-section">
                <span class="k-nav-label">Principal</span>
                <ul class="list-unstyled mb-0">
                <li><a class="k-nav-link" th:href="@{/dashboard}"><span class="k-nav-icon"><i class="bi bi-speedometer2"></i></span>Dashboard</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/clientes}"><span class="k-nav-icon"><i class="bi bi-people"></i></span>Clientes</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/productos}"><span class="k-nav-icon"><i class="bi bi-box-seam"></i></span>Productos</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/ventas}"><span class="k-nav-icon"><i class="bi bi-receipt"></i></span>Ventas</a></li>
                <li><a class="k-nav-link" th:href="@{/vista/detalles}"><span class="k-nav-icon"><i class="bi bi-list-check"></i></span>Detalle de Ventas</a></li>
                </ul>
            </div>
            <div class="k-nav-section" sec:authorize="hasRole('ADMIN')">
                <span class="k-nav-label">Administración</span>
                <ul class="list-unstyled mb-0">
                    <li><a class="k-nav-link active" th:href="@{/vista/usuarios}"><span class="k-nav-icon"><i class="bi bi-shield-person"></i></span>Usuarios</a></li>
                </ul>
            </div>
        </div>
        <div class="k-sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="k-logout-btn">
                    <span class="k-nav-icon"><i class="bi bi-box-arrow-right"></i></span>Cerrar sesión
                </button>
            </form>
        </div>
    </nav>
        <div id="page-content">
            <div style="padding:28px 28px 40px;"><nav class="k-breadcrumb"><a href="/dashboard" th:href="@{/dashboard}">Dashboard</a><span class="sep">/</span><a href="/vista/usuarios" th:href="@{/vista/usuarios}">Usuarios</a><span class="sep">/</span><span class="current">Formulario</span></nav>
                <div style="max-width:640px;margin:0 auto;"><div class="k-card">
                    <div class="k-card-header"><h2 class="k-card-title"><i class="bi bi-shield-person" style="color:var(--k-danger)"></i><span th:text="${usuario.codigoUsuario != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Usuario</span></h2></div>
                    <div class="k-card-body">
                        <form th:action="@{/vista/usuarios/guardar}" th:object="${usuario}" method="post" class="k-needs-validation" novalidate>
                            <input type="hidden" th:field="*{codigoUsuario}"/>
                            <div class="k-form-group"><label class="k-label">Nombre de Usuario <span class="req">*</span></label><input type="text" th:field="*{userName}" class="k-input" placeholder="Ej: jperez" required maxlength="50"/></div>
                            <div class="k-form-group"><label class="k-label">Correo Electrónico</label><input type="email" th:field="*{email}" class="k-input" placeholder="correo@ejemplo.com" maxlength="100"/></div>
                            <div class="k-form-group"><label class="k-label">Contraseña<span th:if="${usuario.codigoUsuario == null}" class="req">*</span><span th:if="${usuario.codigoUsuario != null}" style="font-size:11px;font-weight:400;color:var(--k-muted);margin-left:4px;">(vacío = sin cambiar)</span></label>
                                <div style="position:relative;"><input type="password" id="password" th:field="*{password}" class="k-input" placeholder="Mínimo 6 caracteres" th:required="${usuario.codigoUsuario == null}" style="padding-right:42px;"/>
                                <button type="button" id="togglePwd" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--k-muted);cursor:pointer;font-size:15px;"><i class="bi bi-eye" id="eyeIcon"></i></button></div>
                            </div>
                            <div class="row-grid col-2">
                                <div class="k-form-group"><label class="k-label">Rol</label><select th:field="*{rol}" class="k-select"><option value="USER">USER — General</option><option value="ADMIN">ADMIN — Total</option></select></div>
                                <div class="k-form-group" style="margin-bottom:28px;"><label class="k-label">Estado</label><select th:field="*{estado}" class="k-select"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
                            </div>
                            <div class="d-flex gap-2 justify-end">
                                <a th:href="@{/vista/usuarios}" class="k-btn k-btn-ghost">Cancelar</a>
                                <button type="submit" class="k-btn k-btn-primary"><i class="bi bi-floppy"></i><span th:text="${usuario.codigoUsuario != null ? 'Guardar cambios' : 'Crear usuario'}">Guardar</span></button>
                            </div>
                        </form>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/kinalapp.js}"></script>
<script>
document.getElementById('togglePwd').addEventListener('click',function(){
    var i=document.getElementById('password'),e=document.getElementById('eyeIcon');
    if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}else{i.type='password';e.className='bi bi-eye';}
});
</script>
</body></html>
